<meta charset="utf-8">
<title>Arcanum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --night: #141127;      /* chrome */
    --panel: #221d3f;      /* sidebar + dialogs */
    --panel-hi: #2f2858;
    --frame: #4a3f7a;
    --parch: #f0e4c4;      /* parchment: anything Claude wrote */
    --parch-ink: #2a2016;
    --ink: #0f0c1e;
    --gold: #f2c14e;       /* seals, selection */
    --counsel: #ef5470;    /* seeks counsel (wants a reply) */
    --cast: #74e0f7;       /* casting (working) */
    --muted: #a39bcb;
    --f-display: "Jacquard 24", "Pixelify Sans", serif;
    --f-ui: "Pixelify Sans", ui-rounded, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--parch); font-family: var(--f-ui); font-size: 16px; }
  canvas { image-rendering: pixelated; display: block; }
  button { font: inherit; color: inherit; }
  .lbl { font-family: var(--f-ui); font-weight: 600; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  kbd { font-family: var(--f-ui); font-size: 11px; font-weight: 600; background: var(--ink); border: 1px solid var(--frame); border-radius: 3px; padding: 0 5px; color: var(--parch); }

  /* ---------- app shell: sidebar + main stage ---------- */
  .app { display: grid; grid-template-columns: 312px minmax(0, 1fr); height: 100%; }
  .side {
    background: linear-gradient(180deg, var(--panel), #1b1734); border-right: 3px solid var(--ink); box-shadow: inset -2px 0 0 var(--frame);
    overflow-y: auto; overflow-x: hidden; padding: 16px; display: flex; flex-direction: column; gap: 18px; min-height: 0;
  }
  .stage { min-width: 0; min-height: 0; overflow: auto; padding: 16px; position: relative; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; height: auto; }
    .side { order: 2; border-right: 0; box-shadow: none; border-top: 3px solid var(--ink); }
    .stage { overflow: visible; }
  }

  /* sidebar: brand */
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 44px; line-height: .8; margin: 0; color: var(--gold); text-shadow: 2px 2px 0 var(--ink); }
  .brand p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .sample { align-self: flex-start; font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--ink); background: var(--gold); padding: 2px 7px; border-radius: 2px; }

  /* sidebar: nav */
  .nav { display: grid; gap: 2px; }
  .nav button {
    all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center;
    padding: 7px 10px; border-radius: 4px; font-size: 15px;
  }
  .nav button:hover { background: var(--panel-hi); }
  .nav button:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
  .nav button[aria-current="page"] { background: var(--panel-hi); box-shadow: inset 3px 0 0 var(--gold); }
  .nav button[aria-disabled="true"] { color: var(--muted); cursor: default; }
  .nav .ico { color: var(--gold); text-align: center; font-size: 15px; }
  .nav .soon { font-size: 10px; font-weight: 600; letter-spacing: 1px; color: var(--muted); border: 1px solid var(--frame); padding: 0 5px; border-radius: 2px; }
  .scry { display: grid; gap: 6px; }
  .scry input {
    width: 100%; background: var(--ink); color: var(--parch); border: 2px solid var(--frame); border-radius: 4px; padding: 7px 9px; font: inherit; font-size: 15px;
  }
  .scry input:focus { outline: none; border-color: var(--gold); }
  .results { display: grid; gap: 2px; }

  /* sidebar: awaiting you */
  .await { display: grid; gap: 8px; }
  .await .row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { font-size: 13px; font-weight: 600; padding: 3px 8px; border-radius: 3px; color: var(--ink); }
  .pill.counsel { background: var(--counsel); color: #fff; } .pill.seal { background: var(--gold); } .pill.cast { background: var(--cast); }
  .next { all: unset; box-sizing: border-box; cursor: pointer; margin-left: auto; font-size: 13px; font-weight: 600; padding: 4px 9px; border-radius: 3px; background: var(--parch); color: var(--parch-ink); }
  .next:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* sidebar: ravens */
  .ravens { display: grid; gap: 8px; min-height: 0; }
  .ravens-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tabs { display: inline-flex; background: var(--ink); border-radius: 4px; padding: 2px; }
  .tabs button { all: unset; box-sizing: border-box; cursor: pointer; white-space: nowrap; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 3px; color: var(--muted); }
  .tabs button[aria-pressed="true"] { background: var(--panel-hi); color: var(--parch); }
  .tabs button:focus-visible { outline: 2px solid var(--gold); }
  .feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .raven {
    all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 10px 1fr auto; gap: 4px 9px; align-items: start; width: 100%;
    padding: 8px 9px; border-radius: 4px; background: rgba(15,12,30,.35);
  }
  .raven:hover { background: var(--panel-hi); }
  .raven:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
  .raven .dot { width: 8px; height: 8px; border-radius: 1px; margin-top: 5px; }
  .raven .who { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .raven .who small { font-weight: 400; color: var(--muted); }
  .raven .t { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; gap: 6px; align-items: center; }
  .raven .msg { grid-column: 2 / 4; font-size: 14px; line-height: 1.35; color: #d9d0b6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .raven.unread .who::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--counsel); margin-right: 6px; vertical-align: 2px; }
  .raven.dim { opacity: .62; }
  .g { font-weight: 700; } .g.counsel { color: var(--counsel); } .g.seal { color: var(--gold); } .g.cast { color: var(--cast); } .g.rest { color: var(--muted); }

  /* ---------- map ---------- */
  .mapwrap { position: relative; height: 100%; min-height: 520px; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 3px var(--ink), 0 0 0 5px var(--frame), 0 10px 30px rgba(0,0,0,.45); background: #10284f; }
  @media (max-width: 900px) { .mapwrap { height: 72vh; min-height: 420px; } }
  .world { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .world.zoom { transform: scale(2.8); transition: transform .55s cubic-bezier(.55, 0, .85, .35); }
  .world > canvas.terrain { position: absolute; inset: 0; width: 100%; height: 100%; }
  .flash { position: absolute; inset: 0; background: #fff8e0; opacity: 0; pointer-events: none; }
  .flash.on { opacity: 1; transition: opacity .5s ease-in .1s; }
  .site { all: unset; box-sizing: border-box; cursor: pointer; position: absolute; translate: -50% -82%; display: grid; justify-items: center; gap: 0; }
  .site:focus-visible { outline: none; }
  .site .tag {
    display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; background: rgba(15,12,30,.88); color: var(--parch);
    padding: 3px 8px; border-radius: 3px; white-space: nowrap; box-shadow: 0 0 0 1px var(--frame); margin-top: -4px;
  }
  .site .pin i { font-style: normal; font-size: 12px; padding: 0 5px; border-radius: 2px; color: var(--ink); margin-left: 3px; }
  .site .pin i.counsel { background: var(--counsel); color: #fff; } .site .pin i.seal { background: var(--gold); } .site .pin i.cast { background: var(--cast); }
  .site:hover .tag, .site:focus-visible .tag, .site.sel .tag { box-shadow: 0 0 0 2px var(--gold); }
  .site.sel::before {
    content: "▼"; position: absolute; top: -16px; color: var(--gold); font-size: 14px; text-shadow: 1px 1px 0 var(--ink); animation: bob 1s ease-in-out infinite;
  }
  .site .new { font-size: 10px; letter-spacing: 1px; background: var(--gold); color: var(--ink); padding: 0 4px; border-radius: 2px; animation: blink 1s steps(2) infinite; }
  @keyframes bob { 50% { translate: 0 -3px; } }
  @keyframes blink { 50% { opacity: .3; } }

  .overlay { position: absolute; z-index: 2; }
  .title-scroll {
    top: 14px; left: 14px; padding: 6px 18px 8px; background: linear-gradient(180deg, #f6ebcd, #e2d0a2); color: var(--parch-ink);
    border-radius: 3px; box-shadow: 0 0 0 2px #8a6a3a, 0 0 0 4px var(--ink), 4px 6px 0 2px rgba(0,0,0,.35);
  }
  .title-scroll h2 { font-family: var(--f-display); font-weight: 400; font-size: 36px; line-height: 1; margin: 0; }
  .latest {
    all: unset; box-sizing: border-box; position: absolute; z-index: 2; cursor: pointer; top: 80px; left: 14px; max-width: min(560px, calc(100% - 28px));
    display: flex; gap: 10px; align-items: center; padding: 8px 14px; background: rgba(15,12,30,.9); border-radius: 4px;
    box-shadow: 0 0 0 2px var(--counsel), 0 6px 18px rgba(0,0,0,.4); animation: fly .6s cubic-bezier(.2, .8, .3, 1.2);
  }
  .latest:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .latest .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .latest .txt b { color: var(--counsel); }
  @keyframes fly { from { translate: 0 -30px; opacity: 0; } }
  .tools { top: 14px; right: 14px; display: flex; gap: 8px; }
  .legend {
    left: 14px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 6px 10px; border-radius: 3px; font-size: 13px;
    background: rgba(15,12,30,.8); color: var(--muted); max-width: calc(100% - 28px);
  }
  .keys { right: 14px; bottom: 14px; font-size: 13px; color: var(--muted); background: rgba(15,12,30,.8); padding: 6px 10px; border-radius: 3px; }
  @media (max-width: 700px) { .keys { display: none; } }

  .btn {
    all: unset; box-sizing: border-box; cursor: pointer; font-size: 14px; font-weight: 600; padding: 8px 13px; border-radius: 4px; color: var(--parch-ink);
    background: linear-gradient(180deg, #ffd977, var(--gold)); box-shadow: 0 0 0 2px var(--ink), 0 3px 0 2px var(--ink);
  }
  .btn:active { translate: 0 2px; box-shadow: 0 0 0 2px var(--ink), 0 1px 0 2px var(--ink); }
  .btn:focus-visible { outline: 2px dashed var(--parch); outline-offset: 4px; }
  .btn.alt { background: linear-gradient(180deg, #fff6dc, #e6d6aa); }
  .btn.deny { background: linear-gradient(180deg, #ff7a90, var(--counsel)); color: #fff; }
  .btn.ghost { background: rgba(15,12,30,.88); color: var(--parch); box-shadow: 0 0 0 1px var(--frame); }

  /* ---------- realm ---------- */
  .realm { display: grid; gap: 14px; }
  .realm.in { animation: materialize .5s ease-out; }
  @keyframes materialize { from { opacity: 0; filter: brightness(2); } }
  .realm-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .realm-top h2 { font-family: var(--f-display); font-weight: 400; font-size: 46px; line-height: 1; margin: 0; text-shadow: 2px 2px 0 var(--ink); }
  .realm-top .meta { font-size: 14px; color: var(--muted); }
  .realm-top .right { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .scene { position: relative; height: 300px; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 3px var(--ink), 0 0 0 5px var(--frame); }
  .scene > canvas.backdrop { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scene .landmark { position: absolute; left: 18px; bottom: 26px; }
  .troupe { position: absolute; left: 230px; right: 12px; bottom: 6px; display: flex; gap: 6px; align-items: flex-end; overflow-x: auto; padding-top: 30px; }
  @media (max-width: 640px) { .scene .landmark { display: none; } .troupe { left: 8px; } }
  .mage { all: unset; box-sizing: border-box; cursor: pointer; position: relative; display: grid; justify-items: center; flex: none; }
  .mage .name { font-size: 12px; font-weight: 600; background: rgba(15,12,30,.85); padding: 1px 7px; border-radius: 3px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -6px; }
  .mage.sel .name, .mage:focus-visible .name { background: var(--gold); color: var(--ink); }
  .mage:focus-visible { outline: none; }
  .bubble {
    position: absolute; top: -6px; left: 50%; translate: -50% 0; font-size: 15px; font-weight: 700; line-height: 1;
    padding: 4px 7px; border-radius: 10px; background: var(--parch); color: var(--ink); box-shadow: 0 0 0 2px var(--ink); animation: bbob 1s ease-in-out infinite;
  }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -5px; translate: -50% 0; border: 4px solid transparent; border-top-color: inherit; border-top-color: var(--bub, var(--parch)); }
  .bubble.counsel { --bub: var(--counsel); background: var(--counsel); color: #fff; } .bubble.seal { --bub: var(--gold); background: var(--gold); }
  .bubble.cast { --bub: var(--cast); background: var(--cast); animation: none; }
  .bubble.rest { background: transparent; box-shadow: none; color: #fff; text-shadow: 1px 1px 0 var(--ink); animation: drift 2.4s ease-in-out infinite; }
  .bubble.rest::after { display: none; }
  @keyframes bbob { 50% { translate: -50% -4px; } }
  @keyframes drift { 0% { translate: -20% 4px; opacity: 0; } 50% { opacity: 1; } 100% { translate: 20% -10px; opacity: 0; } }

  .op { display: grid; grid-template-columns: minmax(220px, 290px) minmax(0, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 1100px) { .op { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border-radius: 6px; box-shadow: 0 0 0 3px var(--ink), 0 0 0 5px var(--frame); }
  .circle { padding: 12px; display: grid; gap: 4px; }
  .crow { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 7px 9px; border-radius: 4px; }
  .crow:hover { background: var(--panel-hi); }
  .crow.sel, .crow:focus-visible { background: var(--panel-hi); box-shadow: inset 3px 0 0 var(--gold); outline: none; }
  .crow .cs { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .crow .rk { font-size: 13px; color: var(--muted); }
  .chip { font-size: 11px; font-weight: 700; letter-spacing: .8px; padding: 2px 6px; border-radius: 3px; color: var(--ink); white-space: nowrap; }
  .chip.counsel { background: var(--counsel); color: #fff; } .chip.seal { background: var(--gold); } .chip.cast { background: var(--cast); } .chip.rest { background: var(--muted); }

  .comms { padding: 16px; display: grid; gap: 14px; }
  .dossier { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
  .portrait { border-radius: 4px; box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--frame); padding: 6px 14px 0; background: var(--portrait-bg); }
  .dossier h3 { font-size: 20px; font-weight: 700; margin: 0 0 6px; word-break: break-word; }
  .dossier dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 15px; align-items: center; }
  .dossier dt { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; color: var(--muted); } .dossier dd { margin: 0; }
  .paper {
    background: linear-gradient(180deg, #f6ebcd, var(--parch)); color: var(--parch-ink); padding: 14px 18px; border-radius: 3px;
    box-shadow: 0 0 0 2px #8a6a3a, 0 0 0 4px var(--ink); line-height: 1.5; font-size: 16px;
  }
  .paper .lbl { color: #8a6a3a; display: block; margin-bottom: 6px; }
  .paper p { margin: 0 0 .6em; max-width: 70ch; } .paper p:last-child { margin-bottom: 0; }
  .paper code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: rgba(42,32,22,.08); padding: 0 4px; border-radius: 2px; }
  .paper.casting p:last-child::after { content: "▌"; animation: blink .8s steps(2) infinite; }
  .xmit { max-height: 260px; overflow: auto; }
  .orders { display: grid; gap: 10px; }
  .orders textarea {
    width: 100%; min-height: 84px; resize: vertical; background: var(--ink); color: var(--parch); border: 2px solid var(--frame); border-radius: 4px;
    font: inherit; font-size: 16px; padding: 10px 12px;
  }
  .orders textarea:focus { outline: none; border-color: var(--gold); }
  .via { font-size: 14px; color: var(--muted); line-height: 1.4; }
  .via b { color: var(--parch); font-weight: 600; }
  .btns { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btns .hint { margin-left: auto; font-size: 13px; color: var(--muted); }
  .req { font-family: ui-monospace, Menlo, monospace; font-size: 14px; background: var(--ink); color: var(--gold); padding: 9px 11px; border-radius: 4px; word-break: break-all; }

  .charter { padding: 16px; display: grid; gap: 16px; }
  .charter h3 { font-family: var(--f-display); font-weight: 400; font-size: 32px; margin: 0; line-height: 1; }
  .charter .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 24px; }
  .charter .lbl { display: block; margin-bottom: 6px; }
  .charter input[type=text] { width: 100%; background: var(--ink); color: var(--parch); border: 2px solid var(--frame); border-radius: 4px; font: inherit; font-size: 15px; padding: 8px; }
  .charter input[type=text]:focus { outline: none; border-color: var(--gold); }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice { all: unset; box-sizing: border-box; cursor: pointer; display: grid; justify-items: center; gap: 2px; padding: 4px 6px 6px; background: var(--ink); border: 2px solid var(--frame); border-radius: 4px; font-size: 12px; }
  .choice[aria-pressed="true"], .choice:focus-visible { border-color: var(--gold); outline: none; }
  .sw { all: unset; box-sizing: border-box; cursor: pointer; width: 26px; height: 26px; border-radius: 3px; box-shadow: 0 0 0 2px var(--ink); }
  .sw[aria-pressed="true"], .sw:focus-visible { box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--gold); outline: none; }
  .landlist { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 4px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .landlist li { background: var(--ink); padding: 5px 8px; border-radius: 3px; }
  .charter select { background: var(--ink); color: var(--parch); border: 2px solid var(--frame); border-radius: 4px; font: inherit; font-size: 14px; padding: 6px; max-width: 100%; }

  .toast {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; z-index: 9; max-width: calc(100% - 32px);
    font-size: 14px; font-weight: 600; padding: 11px 16px; border-radius: 4px; background: var(--parch); color: var(--parch-ink);
    box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--gold), 0 8px 20px rgba(0,0,0,.4);
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="app">
  <aside class="side" aria-label="Sidebar">
    <div class="brand">
      <canvas id="logoSprite" aria-hidden="true"></canvas>
      <div><h1>Arcanum</h1><p id="sumline"></p></div>
    </div>
    <span class="sample">SAMPLE DATA · PROTOTYPE</span>

    <nav class="nav" aria-label="Main">
      <button id="navMap" aria-current="page"><span class="ico">◈</span>World map<span></span></button>
      <button id="navScry"><span class="ico">⌕</span>Scry for a mage<kbd>⌘K</kbd></button>
      <div class="scry" id="scryBox" hidden><input id="scry" type="text" placeholder="Name, realm or topic…" aria-label="Search mages"><div class="results" id="results"></div></div>
      <button aria-disabled="true" title="Coming in M5"><span class="ico">✧</span>Summon a mage<span class="soon">LATER</span></button>
      <button aria-disabled="true" title="Coming in M5"><span class="ico">⌂</span>Archive of the departed<span class="soon">LATER</span></button>
      <button aria-disabled="true" title="Settings: sound, hooks, theme"><span class="ico">❖</span>Grimoire<span class="soon">LATER</span></button>
    </nav>

    <section class="await" aria-label="Waiting on you">
      <span class="lbl">Waiting on you</span>
      <div class="row2" id="awaitRow"></div>
    </section>

    <section class="ravens" aria-label="Ravens">
      <div class="ravens-h"><span class="lbl">Ravens · newest first</span>
        <div class="tabs" role="group" aria-label="Filter ravens"><button data-filter="all" aria-pressed="true">All</button><button data-filter="you" aria-pressed="false">Needs you</button></div></div>
      <ul class="feed" id="feed"></ul>
    </section>
  </aside>

  <main class="stage" id="view"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===================== sample data (illustrative, modelled on your real repos) ===================== */
const NOW = Date.now(); const m = n => NOW - n * 60000;
const BANNERS = ["#ef5470", "#74e0f7", "#f2c14e", "#b884f0", "#7fd18a", "#ff9a3c", "#f0e4c4"];
const LANDMARKS = {
  castle: { label: "Castle", biome: "meadow" }, tower: { label: "Tower", biome: "highland" }, grove: { label: "Grove", biome: "forest" },
  cavern: { label: "Cavern", biome: "crystal" }, volcano: { label: "Volcano", biome: "ash" }, pyramid: { label: "Pyramid", biome: "desert" },
  spire: { label: "Spire", biome: "snow" }, village: { label: "Village", biome: "meadow" },

  $("#editRealm").onclick = () => { ui.charter = !ui.charter; renderRealm(); };
  const sc = $("#scene"), bw = Math.round(sc.clientWidth / 3), bd = buildBackdrop(Math.max(40, bw), 100, biome);
  bd.className = "backdrop"; bd.setAttribute("aria-hidden", "true"); sc.prepend(bd);
  const lm = makeLandmark(r.landmark, r.banner, 3, 2); lm.className = "landmark"; sc.insertBefore(lm, $("#troupe"));
  t.forEach(s => {
    const b = document.createElement("button"); b.className = "mage" + (s.id === ui.session ? " sel" : ""); b.dataset.session = s.id;
    b.appendChild(makeMage(s, 3));
    b.insertAdjacentHTML("afterbegin", `<span class="bubble ${STATE[s.state].cls}">${STATE[s.state].glyph}</span>`);
    b.insertAdjacentHTML("beforeend", `<span class="name">${esc(s.callsign)}</span>`);
    b.onclick = () => { ui.session = s.id; renderRealm(); };
    $("#troupe").appendChild(b);
  });
  const ci = $("#circle");
  if (ci) t.forEach(s => {
    const b = document.createElement("button"); b.className = "crow" + (s.id === ui.session ? " sel" : ""); b.dataset.session = s.id;
    b.innerHTML = `<span><span class="cs">${esc(s.callsign)}</span><span class="rk">${RANK[s.model].title} · ${ago(s.since)}</span></span><span class="chip ${STATE[s.state].cls}">${STATE[s.state].chip}</span>`;
    b.onclick = () => { ui.session = s.id; renderRealm(); };
    ci.appendChild(b);
  });
  if (ui.charter) renderCharter(r);
  if (cur && $("#comms")) renderComms(cur);
  renderSide();
}
function renderCharter(r) {
  const others = visibleRealms().filter(x => x.id !== r.id), el = $("#charter");
  el.innerHTML = `<h3>Realm charter</h3>
    <p class="via" style="margin:0">A new realm gets a landmark and banner automatically when its repo is discovered. Change them here.</p>
    <div class="grid">
      <div><label class="lbl" for="rname">Name</label><input type="text" id="rname" value="${esc(r.name)}"></div>
      <div><span class="lbl">Banner</span><div class="choices">${BANNERS.map(c => `<button class="sw" data-banner="${c}" style="background:${c}" aria-label="Banner ${c}" aria-pressed="${c === r.banner}"></button>`).join("")}</div></div>
      <div style="grid-column:1/-1"><span class="lbl">Landmark</span><div class="choices" id="lmChoices"></div></div>
      <div><span class="lbl">Lands (folders and repos in this realm)</span><ul class="landlist">${r.lands.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
        <label class="lbl" for="merge">Absorb another realm</label>
        <select id="merge"><option value="">Choose a realm…</option>${others.map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select></div>
    </div>`;
  for (const [k, v] of Object.entries(LANDMARKS)) {
    const b = document.createElement("button"); b.className = "choice"; b.setAttribute("aria-pressed", k === r.landmark);
    b.appendChild(makeLandmark(k, r.banner, 2)); b.insertAdjacentHTML("beforeend", `<span>${v.label}</span>`); $("#lmChoices").appendChild(b);
    b.onclick = () => { r.landmark = k; saveRealms(); renderRealm(); };
  }
  el.querySelectorAll("[data-banner]").forEach(b => b.onclick = () => { r.banner = b.dataset.banner; saveRealms(); renderRealm(); });
  $("#rname").onchange = e => { r.name = e.target.value.trim() || r.name; saveRealms(); renderRealm(); };
  $("#merge").onchange = e => {
    const o = realmOf(e.target.value); if (!o) return;
    r.lands.push(...o.lands); SESSIONS.filter(s => s.realm === o.id).forEach(s => s.realm = r.id);
    REALMS = REALMS.filter(x => x.id !== o.id); saveRealms(); toast(`${o.name} absorbed into ${r.name}`); renderRealm();
  };
}
function renderComms(s) {
  const st = STATE[s.state], relay = s.host !== "cmux", c = $("#comms");
  c.innerHTML = `<div class="dossier"><div class="portrait" id="portrait"></div><div>
      <h3>${esc(s.callsign)}</h3>
      <dl><dt>RANK</dt><dd>${RANK[s.model].title} · ${RANK[s.model].model}</dd>
      <dt>STATE</dt><dd><span class="chip ${st.cls}">${st.label.toUpperCase()}</span> for ${ago(s.since)}</dd>
      <dt>DWELLS IN</dt><dd>${esc(s.where)}</dd></dl></div></div>
    <div class="paper"><span class="lbl">The matter at hand</span><p>${esc(s.brief)}</p></div>
    <div class="paper xmit${s.state === "cast" ? " casting" : ""}"><span class="lbl">Latest missive</span>${s.xmit.map(p => `<p>${p}</p>`).join("")}</div>
    ${s.state === "seal" ? `<div class="orders"><span class="lbl">Asks for your seal to run</span><div class="req">${esc(s.req)}</div>
      <div class="btns"><button class="btn" data-act="grant">Grant seal</button><button class="btn deny" data-act="refuse">Refuse</button>
      <button class="btn alt" data-act="portal">Open portal</button></div></div>` :
    `<form class="orders" id="orders"><label class="lbl" for="reply">Send word</label>
      <textarea id="reply" placeholder="${s.state === "cast" ? "Queue word for when it finishes casting…" : "Type your reply…"}"></textarea>
      <div class="via">${relay ? `This mage dwells in <b>${esc(s.where)}</b>, outside cmux, so your words go <b>by raven</b>: it is told the message is relayed from you, not typed in its terminal.` : `Your words are typed straight into its <b>cmux</b> pane, as if you were there.`}</div>
      <div class="btns"><button class="btn" type="submit">${relay ? "Send by raven" : "Send word"}</button><button class="btn alt" type="button" data-act="portal">Open portal</button>
      <span class="hint"><kbd>⌘</kbd> + <kbd>⏎</kbd> send</span></div></form>`}`;
  $("#portrait").appendChild(makeMage(s, 3));
  const f = $("#orders");
  if (f) {
    f.onsubmit = e => { e.preventDefault(); const t = $("#reply").value.trim(); if (!t) return toast("Write something first"); act(s, t, relay ? "Sent by raven" : "Word sent"); };
    $("#reply").onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) f.requestSubmit(); };
  }
  c.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if (a === "portal") return toast(s.host === "cmux" ? `Portal opened: ${s.where}` : `Portal opened: ${s.where} (window only)`);
    act(s, null, a === "grant" ? "Seal granted" : "Seal refused");
  });
}
function act(s, text, msg) {
  s.state = "cast"; s.since = Date.now();
  s.xmit = [text ? `Understood. Working on: “${esc(text)}”` : msg === "Seal granted" ? "Seal received. Running it now." : "Understood. I'll find another way."];
  s.brief = text ? `Acting on your word: ${text}` : msg === "Seal granted" ? "Permission granted; continuing." : "Permission refused; finding another route.";
  toast(`${msg} → ${s.callsign}`); renderRealm();
}
function goMap() { renderMap(); const el = document.querySelectorAll(".site")[ui.mapSel]; el && el.focus({ preventScroll: true }); }
let tt; function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 2400); }
function nextRequest() {
  const q = live().filter(needsYou).sort((a, b) => b.since - a.since); if (!q.length) return toast("No one is waiting on you");
  const i = ui.view === "realm" ? (q.findIndex(s => s.id === ui.session) + 1) % q.length : 0;
  ui.view === "map" ? travel(q[i].realm, q[i].id) : openRealm(q[i].realm, q[i].id);
}
function goSession(id) { const s = SESSIONS.find(x => x.id === id); if (!s) return; ui.view === "map" ? travel(s.realm, s.id) : openRealm(s.realm, s.id); }

/* scry (search) */
$("#navMap").onclick = () => { if (ui.view !== "map") goMap(); };
$("#navScry").onclick = () => { const b = $("#scryBox"); b.hidden = !b.hidden; if (!b.hidden) $("#scry").focus(); };
$("#scry").oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  const hits = !q ? [] : live().filter(s => [s.callsign, s.brief, realmOf(s.realm).name, RANK[s.model].title].join(" ").toLowerCase().includes(q)).slice(0, 6);
  $("#results").innerHTML = hits.map(s => `<button class="raven" data-go="${s.id}"><span class="dot" style="background:${realmOf(s.realm).banner}"></span>
    <span class="who">${esc(s.callsign)} <small>· ${esc(realmOf(s.realm).name)}</small></span><span class="t"><span class="g ${STATE[s.state].cls}">${STATE[s.state].glyph}</span></span></button>`).join("")
    || (q ? `<span class="via">No mage answers to that.</span>` : "");
};

document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) goSession(g.dataset.go); });
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#scryBox").hidden = false; $("#scry").focus(); return; }
  if (e.target.matches("textarea, input, select")) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "n" || e.key === "N") return nextRequest();
  if (ui.view === "map") {
    const n = document.querySelectorAll(".site").length, mv = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (mv !== undefined && n) { e.preventDefault(); ui.mapSel = (ui.mapSel + mv + n) % n; markMap(); document.querySelectorAll(".site")[ui.mapSel].focus(); }
  } else {
    if (e.key === "Escape") return goMap();
    if (e.key === "r" || e.key === "R") { const t = $("#reply"); if (t) { e.preventDefault(); t.focus(); } }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); const ids = [...document.querySelectorAll(".crow")].map(b => b.dataset.session);
      const i = ids.indexOf(ui.session) + (e.key === "ArrowDown" ? 1 : -1); if (ids[i]) { ui.session = ids[i]; renderRealm(); document.querySelector(".crow.sel").focus(); }
    }
  }
});

/* animation clock */
const logo = $("#logoSprite"); const drawLogo = fr => renderSprite(logo, 38, 54, 1.25, c => drawMage(c, "fable", "cast", fr));
drawLogo(0);
if (!still) setInterval(() => {
  frame++;
  for (const sp of sprites) { if (!sp.c.isConnected) { sprites.delete(sp); continue; } sp.draw(frame); }
  drawLogo(frame);
}, 260);

renderMap();
</script>
