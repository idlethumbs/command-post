<meta charset="utf-8">
<title>Arcanum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=Silkscreen&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --night: #17142b;      /* chrome */
    --panel: #262046;      /* dialog boxes */
    --frame: #4a3f7a;
    --parch: #efe3c2;      /* parchment */
    --ink: #120f22;
    --gold: #f2c14e;       /* seals, rank, selection */
    --counsel: #e8486b;    /* seeks counsel (wants a reply) */
    --cast: #6fe3ff;       /* casting (working) */
    --muted: #9a92c4;
    --sea: #1d3b6e;
    --f-display: "Jacquard 24", "Pixelify Sans", serif;
    --f-label: "Silkscreen", ui-monospace, monospace;
    --f-body: "Pixelify Sans", ui-rounded, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--night); color: var(--parch); font-family: var(--f-body); font-size: 17px;
    padding-inline: 16px; padding-block: 16px 40px;
  }
  canvas { image-rendering: pixelated; display: block; }
  .wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; }
  .px {
    background: var(--panel);
    box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--frame), 0 0 0 9px var(--ink), 6px 6px 0 9px rgba(0,0,0,.35);
    margin: 9px;
  }
  .lbl { font-family: var(--f-label); font-size: 12px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
  kbd { font-family: var(--f-label); font-size: 11px; background: var(--ink); border: 2px solid var(--frame); padding: 0 5px; color: var(--parch); }
  .hint { font-family: var(--f-label); font-size: 11px; color: var(--muted); }

  header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo h1 { font-family: var(--f-display); font-weight: 400; font-size: 52px; line-height: .8; margin: 0; color: var(--gold); text-shadow: 3px 3px 0 var(--ink); }
  .logo small { display: block; margin-top: 6px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat { font-family: var(--f-label); font-size: 12px; padding: 4px 9px; background: var(--ink); border: 2px solid var(--frame); }
  .stat b { font-size: 14px; margin-right: 6px; }
  .stat.counsel b { color: var(--counsel); } .stat.seal b { color: var(--gold); } .stat.cast b { color: var(--cast); }
  .sample { font-family: var(--f-label); font-size: 11px; color: var(--ink); background: var(--gold); padding: 3px 8px; }

  /* ravens feed */
  .ravens { padding: 12px 14px 10px; }
  .ravens h2 { margin: 0 0 8px; display: flex; gap: 10px; align-items: center; }
  .feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .feed button {
    all: unset; cursor: pointer; width: 100%; display: grid; grid-template-columns: 50px 22px minmax(0, 140px) 1fr; gap: 10px;
    align-items: baseline; padding: 4px 6px; font-size: 16px;
  }
  .feed button:hover, .feed button:focus-visible { background: var(--frame); outline: none; }
  .feed .t { font-family: var(--f-label); font-size: 12px; color: var(--muted); }
  .feed .k { font-family: var(--f-label); font-size: 13px; }
  .feed .who { font-family: var(--f-label); font-size: 12px; color: var(--gold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feed .msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c-counsel { color: var(--counsel); } .c-seal { color: var(--gold); } .c-cast { color: var(--cast); } .c-rest { color: var(--muted); }

  /* world map */
  .map-h { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; padding-inline: 9px; }
  .map-h h2 { font-family: var(--f-display); font-weight: 400; font-size: 38px; line-height: 1; margin: 0; }
  .map-h .right { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .worldframe { overflow: hidden; position: relative; padding: 0; }
  .world { position: relative; aspect-ratio: 96 / 60; max-width: 100%; width: 100%; transform-origin: 50% 50%; }
  .world.zoom { transform: scale(4); filter: brightness(1.7); transition: transform .5s steps(8), filter .5s steps(8); }
  .world > canvas.terrain { position: absolute; inset: 0; width: 100%; height: 100%; }
  .site {
    all: unset; cursor: pointer; position: absolute; translate: -50% -78%; display: grid; justify-items: center; gap: 2px;
  }
  .site .tag {
    display: flex; gap: 6px; align-items: center; font-family: var(--f-label); font-size: 11px; background: var(--ink); color: var(--parch);
    padding: 2px 6px; white-space: nowrap; box-shadow: 0 0 0 2px var(--frame);
  }
  .site .pin { display: inline-flex; gap: 3px; }
  .site .pin i { font-style: normal; padding: 0 4px; color: var(--ink); }
  .site .pin i.counsel { background: var(--counsel); color: var(--parch); } .site .pin i.seal { background: var(--gold); }
  .site .pin i.cast { background: var(--cast); }
  .site:hover .tag, .site:focus-visible .tag, .site.sel .tag { box-shadow: 0 0 0 2px var(--gold); outline: none; }
  .site:focus-visible { outline: none; }
  .site.sel canvas { animation: hop .7s steps(2) infinite; }
  .site .new { font-family: var(--f-label); font-size: 10px; background: var(--gold); color: var(--ink); padding: 0 4px; animation: blink 1s steps(2) infinite; }
  @keyframes hop { 50% { translate: 0 -3px; } }
  @keyframes bhop { 50% { translate: -50% -3px; } }
  @keyframes blink { 50% { opacity: .25; } }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 8px 12px; font-family: var(--f-label); font-size: 11px; color: var(--muted); background: var(--ink); }

  /* realm */
  .realm-in { animation: materialize .45s steps(5); }
  @keyframes materialize { from { opacity: 0; filter: brightness(2.2); } to { opacity: 1; filter: none; } }
  .realm-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-inline: 9px; }
  .realm-top h2 { font-family: var(--f-display); font-weight: 400; font-size: 42px; line-height: 1; margin: 0; }
  .realm-top .lands { font-family: var(--f-label); font-size: 11px; color: var(--muted); }
  .realm-top .right { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .scene {
    position: relative; min-height: 190px; display: flex; align-items: flex-end; gap: 18px; padding: 16px 20px 14px 150px; flex-wrap: wrap;
    background-image: var(--biome-tile); background-size: 48px 48px;
  }
  .scene .landmark { position: absolute; left: 14px; bottom: 10px; }
  @media (max-width: 640px) { .scene { padding-left: 20px; padding-top: 120px; } .scene .landmark { top: 8px; bottom: auto; } }
  .mage { all: unset; cursor: pointer; position: relative; display: grid; justify-items: center; gap: 4px; }
  .mage .name { font-family: var(--f-label); font-size: 10px; background: rgba(18,15,34,.85); padding: 1px 5px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mage.sel .name, .mage:focus-visible .name { background: var(--gold); color: var(--ink); }
  .mage:focus-visible { outline: none; }
  .bubble {
    position: absolute; top: -14px; left: 50%; translate: -50% 0; font-family: var(--f-label); font-size: 12px; line-height: 1;
    padding: 3px 5px; background: var(--parch); color: var(--ink); box-shadow: 0 0 0 2px var(--ink); animation: bhop .8s steps(2) infinite;
  }
  .bubble.counsel { background: var(--counsel); color: var(--parch); } .bubble.seal { background: var(--gold); }
  .bubble.cast { background: var(--cast); animation: none; } .bubble.rest { background: transparent; box-shadow: none; color: var(--parch); animation: drift 2s steps(4) infinite; }
  @keyframes drift { 0% { translate: -30% 0; opacity: 0; } 50% { opacity: 1; } 100% { translate: 10% -8px; opacity: 0; } }

  .op { display: grid; grid-template-columns: minmax(240px, 320px) 1fr; gap: 12px; align-items: start; }
  @media (max-width: 820px) { .op { grid-template-columns: 1fr; } .feed button { grid-template-columns: 44px 20px 1fr; } .feed .who { display: none; } }
  .roster { padding: 12px; display: grid; gap: 4px; }
  .row { all: unset; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border: 2px solid transparent; }
  .row:hover { background: var(--frame); }
  .row.sel, .row:focus-visible { border-color: var(--gold); background: var(--frame); outline: none; }
  .row .cs { font-family: var(--f-label); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .row .rk { font-size: 14px; color: var(--muted); }
  .chip { font-family: var(--f-label); font-size: 10px; padding: 2px 5px; color: var(--ink); white-space: nowrap; }
  .chip.counsel { background: var(--counsel); color: var(--parch); } .chip.seal { background: var(--gold); }
  .chip.cast { background: var(--cast); } .chip.rest { background: var(--muted); }

  .comms { padding: 16px; display: grid; gap: 14px; }
  .dossier { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
  .portrait { box-shadow: 0 0 0 3px var(--ink); padding: 4px 8px; background-image: var(--biome-tile); background-size: 48px 48px; }
  .dossier h3 { font-family: var(--f-label); font-weight: 400; font-size: 16px; margin: 0 0 8px; word-break: break-word; }
  .dossier dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 16px; }
  .dossier dt { font-family: var(--f-label); font-size: 11px; color: var(--muted); padding-top: 3px; } .dossier dd { margin: 0; }
  .paper { background: var(--parch); color: var(--ink); padding: 14px 16px; box-shadow: 0 0 0 3px var(--ink); line-height: 1.45; }
  .paper .lbl { color: #7a5a24; display: block; margin-bottom: 6px; }
  .paper p { margin: 0 0 .6em; max-width: 68ch; } .paper p:last-child { margin-bottom: 0; }
  .paper code { font-family: var(--f-label); font-size: 13px; background: rgba(18,15,34,.08); padding: 0 4px; }
  .paper.casting p:last-child::after { content: "▌"; animation: blink .8s steps(2) infinite; }
  .xmit { max-height: 250px; overflow: auto; }
  .orders { display: grid; gap: 10px; }
  .orders textarea {
    width: 100%; min-height: 84px; resize: vertical; background: var(--ink); color: var(--parch); border: 3px solid var(--frame);
    font-family: var(--f-body); font-size: 17px; padding: 10px;
  }
  .orders textarea:focus { outline: none; border-color: var(--gold); }
  .via { font-size: 15px; color: var(--muted); }
  .via b { color: var(--parch); font-weight: 600; }
  .btns { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn {
    all: unset; cursor: pointer; font-family: var(--f-label); font-size: 12px; padding: 9px 12px; color: var(--ink); background: var(--gold);
    box-shadow: 0 0 0 3px var(--ink), 4px 4px 0 3px var(--ink);
  }
  .btn:active { translate: 2px 2px; box-shadow: 0 0 0 3px var(--ink), 2px 2px 0 3px var(--ink); }
  .btn:focus-visible { outline: 3px dashed var(--parch); outline-offset: 5px; }
  .btn.alt { background: var(--parch); } .btn.deny { background: var(--counsel); color: var(--parch); }
  .btn.ghost { background: var(--ink); color: var(--parch); box-shadow: 0 0 0 2px var(--frame); }
  .btns .hint { margin-left: auto; }
  .req { font-family: var(--f-label); font-size: 13px; background: var(--ink); color: var(--gold); padding: 8px 10px; word-break: break-all; }

  /* charter (realm editor) */
  .charter { padding: 16px; display: grid; gap: 16px; }
  .charter h3 { font-family: var(--f-display); font-weight: 400; font-size: 32px; margin: 0; line-height: 1; }
  .charter .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 24px; }
  .charter label.lbl, .charter .lbl { display: block; margin-bottom: 6px; }
  .charter input[type=text] { width: 100%; background: var(--ink); color: var(--parch); border: 3px solid var(--frame); font-family: var(--f-label); font-size: 14px; padding: 8px; }
  .charter input[type=text]:focus { outline: none; border-color: var(--gold); }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice { all: unset; cursor: pointer; display: grid; justify-items: center; gap: 2px; padding: 4px 6px; background: var(--ink); border: 2px solid var(--frame); font-family: var(--f-label); font-size: 10px; }
  .choice[aria-pressed="true"], .choice:focus-visible { border-color: var(--gold); outline: none; }
  .sw { all: unset; cursor: pointer; width: 26px; height: 26px; box-shadow: 0 0 0 2px var(--ink); }
  .sw[aria-pressed="true"], .sw:focus-visible { box-shadow: 0 0 0 2px var(--ink), 0 0 0 5px var(--gold); outline: none; }
  .landlist { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 4px; font-family: var(--f-label); font-size: 12px; }
  .landlist li { background: var(--ink); padding: 5px 8px; }
  .charter select { background: var(--ink); color: var(--parch); border: 3px solid var(--frame); font-family: var(--f-label); font-size: 12px; padding: 6px; max-width: 100%; }

  .toast {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; z-index: 9; max-width: calc(100% - 32px);
    font-family: var(--f-label); font-size: 12px; padding: 12px 14px; background: var(--parch); color: var(--ink);
    box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--gold), 0 0 0 9px var(--ink);
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="logo">
      <canvas id="logoSprite" width="63" height="69" aria-hidden="true"></canvas>
      <div><h1>Arcanum</h1><small class="lbl">your claude sessions · localhost</small></div>
    </div>
    <div class="stats" id="stats"></div>
    <span class="sample">SAMPLE DATA · PROTOTYPE</span>
  </header>

  <section class="ravens px" aria-label="Ravens">
    <h2 class="lbl"><span class="c-counsel">✉</span>Ravens · newest first</h2>
    <ul class="feed" id="feed"></ul>
  </section>

  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===================== sample data (illustrative, modelled on your real repos) ===================== */
const NOW = Date.now(); const m = n => NOW - n * 60000;
const BANNERS = ["#e8486b", "#6fe3ff", "#f2c14e", "#b884f0", "#7fd18a", "#ff9a3c", "#efe3c2"];
const LANDMARKS = {

const DEFAULT_REALMS = [
  { id: "agent-rails", name: "Agent Rails", landmark: "castle", banner: "#e8486b", pos: { x: 22, y: 30 }, lands: ["~/projects/agent-rails", "~/projects/agent-rails/.claude/worktrees/*"] },
  { id: "genui-module", name: "GenUI Module", landmark: "cavern", banner: "#6fe3ff", pos: { x: 49, y: 22 }, lands: ["~/projects/genui-module"] },
  { id: "orchestration", name: "Orchestration", landmark: "tower", banner: "#f2c14e", pos: { x: 77, y: 28 }, lands: ["~/projects/orchestration (no repo)", "~/projects/orchestration/orchestrator"] },
  { id: "lmax", name: "LMAX", landmark: "spire", banner: "#b884f0", pos: { x: 80, y: 72 }, lands: ["~/projects/lmax-frontend-tools", "~/projects/lmax-corp-nextjs"] },
  { id: "inbox-pa", name: "Inbox PA", landmark: "village", banner: "#efe3c2", pos: { x: 30, y: 72 }, lands: ["~/projects/inbox-pa"] },
  { id: "genui-examples", name: "GenUI Examples", landmark: "grove", banner: "#7fd18a", pos: { x: 55, y: 60 }, lands: ["~/projects/genui-examples"] },
  { id: "prism", name: "Prism", landmark: "volcano", banner: "#ff9a3c", pos: { x: 9, y: 58 }, lands: ["~/projects/prism"], undiscovered: true },
];
/* state: counsel = wants a reply, seal = wants permission, cast = working, rest = idle/done */
const SESSIONS = [
  { id: "s1", realm: "agent-rails", callsign: "agent-rails-e4", model: "opus", state: "counsel", since: m(3), host: "cmux", where: "cmux · agent-rails / pane 2",

    xmit: ["Migration <code>0042_parent_synced_at</code> is in place and all 214 tests pass.", "Two ways to backfill existing skill rows:", "(a) Inside the migration: one step, but it locks the skills table for ~40s on prod-sized data.", "(b) Ship the column nullable, then backfill with a separate job: no lock, two deploys.", "I recommend (b). Which do you want?"] },
  { id: "s2", realm: "agent-rails", callsign: "agent-rails-10", model: "sonnet", state: "cast", since: m(1), host: "warp", where: "Warp",
    brief: "Rewriting the elsemem client retry logic; running the integration suite now.", xmit: ["Running <code>pnpm test --filter elsemem-client</code> …"] },
  { id: "s3", realm: "agent-rails", callsign: "gcloud-creds", model: "haiku", state: "seal", since: m(11), host: "bg", where: "Background",
    brief: "The tutorial walkthrough is paused: it wants to refresh Google Cloud credentials.",
    xmit: ["I need to refresh application-default credentials before continuing the tutorial."], req: "Bash · gcloud auth application-default login" },
  { id: "s4", realm: "genui-module", callsign: "genui-module-6d", model: "opus", state: "counsel", since: m(8), host: "cmux", where: "cmux · genui / pane 1",

  { id: "s5", realm: "genui-module", callsign: "genui-module-e6", model: "fable", state: "rest", since: m(60 * 24 * 6), host: "vscode", where: "VS Code",

  { id: "s6", realm: "orchestration", callsign: "orchestration-9b", model: "sonnet", state: "counsel", since: m(26), host: "cmux", where: "cmux · orchestration / pane 1",
    brief: "The task-queue schema is drafted. It's unsure whether retries belong on the job or the worker.",
    xmit: ["The schema draft is in <code>docs/queue.md</code>.", "Open question: should retry policy live on the job record (per-task control) or on the worker (simpler, uniform)?", "I lean per-job. OK to proceed?"] },
  { id: "s7", realm: "orchestration", callsign: "orchestrator-a5", model: "fable", state: "cast", since: m(2), host: "cmux", where: "cmux · orchestration / pane 2",

  { id: "s8", realm: "orchestration", callsign: "orchestrator-df", model: "haiku", state: "rest", since: m(60 * 40), host: "vscode", where: "VS Code",
    brief: "Lint fixes landed.", xmit: ["Done: 12 files cleaned."] },
  { id: "s9", realm: "lmax", callsign: "lmax-ui-tier", model: "opus", state: "counsel", since: m(64), host: "warp", where: "Warp",
    brief: "Section 3 of the services-tier proposal is drafted and needs your review before section 4.",
    xmit: ["Section 3 (BFF responsibilities) is drafted in Notion.", "Before I start section 4: does caching stay in scope for phase 1?"] },
  { id: "s10", realm: "inbox-pa", callsign: "inbox-pa-3c", model: "haiku", state: "cast", since: m(4), host: "cmux", where: "cmux · inbox / pane 1",
    brief: "Triaging this morning's inbox into the digest.", xmit: ["Sorting 41 threads …"] },
  { id: "s11", realm: "genui-examples", callsign: "genui-examples-2f", model: "sonnet", state: "rest", since: m(60 * 24 * 6), host: "vscode", where: "VS Code",
    brief: "The example gallery builds cleanly.", xmit: ["All 18 examples render."] },
  { id: "s12", realm: "prism", callsign: "prism-01", model: "sonnet", state: "counsel", since: m(0), host: "cmux", where: "cmux · prism / pane 1", hidden: true,

    xmit: ["Before I scaffold: should tokens use <code>color.brand.primary</code> or <code>brand-primary</code>?"] },
];
const RANK = {
  haiku:  { title: "Apprentice", model: "Haiku 4.5" },
  sonnet: { title: "Magician",   model: "Sonnet 5" },
  opus:   { title: "Sorcerer",   model: "Opus 5.5" },
  fable:  { title: "Archmage",   model: "Fable 5.1" },
};
const STATE = {
  counsel: { label: "Seeks counsel", chip: "COUNSEL", cls: "counsel", glyph: "!", feed: "!" },
  seal:    { label: "Awaits your seal", chip: "SEAL?",  cls: "seal",    glyph: "?", feed: "?" },
  cast:    { label: "Casting",         chip: "CASTING", cls: "cast",    glyph: "✦", feed: "✦" },
  rest:    { label: "Meditating",      chip: "RESTING", cls: "rest",    glyph: "z", feed: "·" },
};
const needsYou = s => s.state === "counsel" || s.state === "seal";

/* realm customisation persists per viewer (prototype convenience only) */
let REALMS = structuredClone(DEFAULT_REALMS);
try { const saved = JSON.parse(localStorage.getItem("arcanum.realms") || "null"); if (saved) REALMS = saved; } catch (e) {}
function saveRealms() { try { localStorage.setItem("arcanum.realms", JSON.stringify(REALMS)); } catch (e) {} }
const visibleRealms = () => REALMS.filter(r => !r.undiscovered);
const realmOf = id => REALMS.find(r => r.id === id);
const troopsOf = id => SESSIONS.filter(s => s.realm === id && !s.hidden);

/* ===================== pixel art ===================== */

/* ---- terrain: land grows around each realm; biome = nearest realm (Voronoi), so realms are regions ---- */
const BIOME = {
  meadow:   ["#6fb24a", "#5ea13e", "#82c25a"],
  forest:   ["#2f7a3a", "#25632f", "#3f8f45"],
  highland: ["#8a8f5a", "#757a4a", "#9aa06a"],
  crystal:  ["#6a5a9a", "#58488a", "#7ff0ff"],
  ash:      ["#4a3a3a", "#3a2c2c", "#ff6a2a"],
  desert:   ["#e0c07a", "#d4b06a", "#ecd08e"],
  snow:     ["#e8eef5", "#cfd9e6", "#ffffff"],

const TW = 96, TH = 60;
function renderTerrain() {
  const c = document.createElement("canvas"); c.width = TW; c.height = TH; c.className = "terrain";
  c.setAttribute("role", "img"); c.setAttribute("aria-label", "World map of your realms");

    let best = null, bd = 1e9, land = 0;

      const dx = x - r.pos.x / 100 * TW, dy = (y - r.pos.y / 100 * TH) * 1.25, d = Math.hypot(dx, dy);

    else if (land < .42) col = n < .1 ? "#3d6fb0" : "#2f5fa0";

    else if (best.undiscovered) col = n < .5 ? "#3a3550" : (n < .8 ? "#46405f" : "#524b6e");

}

}
function renderComms(s) {
  const st = STATE[s.state], relay = s.host !== "cmux";
  const c = $("#comms");
  c.innerHTML = `<div class="dossier"><div class="portrait" id="portrait"></div><div>
      <h3>${esc(s.callsign)}</h3>
      <dl><dt>RANK</dt><dd>${RANK[s.model].title} · ${RANK[s.model].model}</dd>
      <dt>STATE</dt><dd><span class="chip ${st.cls}">${st.label.toUpperCase()}</span> for ${ago(s.since)}</dd>
      <dt>DWELLS IN</dt><dd>${esc(s.where)}</dd></dl></div></div>
    <div class="paper"><span class="lbl">The matter at hand</span><p>${esc(s.brief)}</p></div>
    <div class="paper xmit${s.state === "cast" ? " casting" : ""}"><span class="lbl">Latest missive</span>${s.xmit.map(p => `<p>${p}</p>`).join("")}</div>
    ${s.state === "seal" ? `<div class="orders"><span class="lbl">Asks for your seal to run</span><div class="req">${esc(s.req)}</div>
      <div class="btns"><button class="btn" data-act="grant">Grant seal</button><button class="btn deny" data-act="refuse">Refuse</button>
      <button class="btn alt" data-act="portal">Open portal</button></div></div>` :
    `<form class="orders" id="orders"><label class="lbl" for="reply">Send word</label>
      <textarea id="reply" placeholder="${s.state === "cast" ? "Queue word for when it finishes casting…" : "Type your reply…"}"></textarea>
      <div class="via">${relay ? `This mage dwells in <b>${esc(s.where)}</b>, outside cmux, so your words go <b>by raven</b>: it is told the message is relayed from you, not typed in its terminal.` : `Your words are typed straight into its <b>cmux</b> pane, as if you were there.`}</div>
      <div class="btns"><button class="btn" type="submit">${relay ? "Send by raven" : "Send word"}</button><button class="btn alt" type="button" data-act="portal">Open portal</button>
      <span class="hint"><kbd>⌘</kbd>+<kbd>⏎</kbd> send</span></div></form>`}`;
  $("#portrait").appendChild(makeMage(s, 6));
  const f = $("#orders");
  if (f) {
    f.onsubmit = e => { e.preventDefault(); const t = $("#reply").value.trim(); if (!t) return toast("WRITE SOMETHING FIRST"); act(s, t, relay ? "SENT BY RAVEN" : "WORD SENT"); };
    $("#reply").onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) f.requestSubmit(); };
  }
  c.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if (a === "portal") return toast(s.host === "cmux" ? `PORTAL OPENED: ${s.where.toUpperCase()}` : `PORTAL OPENED: ${s.where.toUpperCase()} (WINDOW ONLY)`);
    act(s, null, a === "grant" ? "SEAL GRANTED" : "SEAL REFUSED");
  });
}
function act(s, text, msg) {
  s.state = "cast"; s.since = Date.now();
  s.xmit = [text ? `Understood. Working on: “${esc(text)}”` : msg === "SEAL GRANTED" ? "Seal received. Running it now." : "Understood. I'll find another way."];
  s.brief = text ? `Acting on your word: ${text}` : msg === "SEAL GRANTED" ? "Permission granted; continuing." : "Permission refused; finding another route.";
  toast(`${msg} → ${s.callsign.toUpperCase()}`); renderStats(); renderFeed(); renderRealm();
}
function goMap() { renderMap(); const el = document.querySelectorAll(".site")[ui.mapSel]; el && el.focus({ preventScroll: true }); }
let tt; function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 2200); }
function nextRequest() {
  const q = live().filter(needsYou).sort((a, b) => b.since - a.since); if (!q.length) return toast("NO ONE IS WAITING ON YOU");
  const i = ui.view === "realm" ? (q.findIndex(s => s.id === ui.session) + 1) % q.length : 0;
  ui.view === "map" ? travel(q[i].realm, q[i].id) : openRealm(q[i].realm, q[i].id);
}

document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) { const s = SESSIONS.find(x => x.id === g.dataset.go); ui.view === "map" ? travel(s.realm, s.id) : openRealm(s.realm, s.id); } });
document.addEventListener("keydown", e => {
  if (e.target.matches("textarea, input, select")) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "n" || e.key === "N") return nextRequest();
  if (ui.view === "map") {
    const n = document.querySelectorAll(".site").length;
    const mv = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (mv !== undefined) { e.preventDefault(); ui.mapSel = (ui.mapSel + mv + n) % n; markMap(); document.querySelectorAll(".site")[ui.mapSel].focus(); }
  } else {
    if (e.key === "Escape") return goMap();
    if (e.key === "r" || e.key === "R") { const t = $("#reply"); if (t) { e.preventDefault(); t.focus(); } }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); const ids = [...document.querySelectorAll(".row")].map(b => b.dataset.session);
      const i = ids.indexOf(ui.session) + (e.key === "ArrowDown" ? 1 : -1); if (ids[i]) { ui.session = ids[i]; renderRealm(); document.querySelector(".row.sel").focus(); }
    }
  }
});

/* animation clock: 2-frame sprite cycle */
let frame = 0;
paint($("#logoSprite"), mageRects("fable", "cast", 0), 3);
if (!still) setInterval(() => {
  frame++;
  for (const sp of sprites) { if (!sp.c.isConnected) { sprites.delete(sp); continue; } paint(sp.c, mageRects(sp.s.model, sp.s.state, frame + (sp.s.id.length % 2)), sp.scale); }
  paint($("#logoSprite"), mageRects("fable", "cast", frame), 3);
}, 420);

renderStats(); renderFeed(); renderMap();
</script>
